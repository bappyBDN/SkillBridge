name: ci
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      # Tests always run against throwaway SQLite; never a real database.
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov
      - run: python -m compileall -q backend
      # Engine, GraphRAG, security, API and tenant-isolation tests (SB-011).
      # The coverage gate keeps new endpoints from shipping untested; it sits a
      # little below the measured coverage so it only trips on real regressions.
      - name: Tests + coverage gate
        working-directory: backend
        run: python -m pytest -q tests --cov=. --cov-report=term-missing:skip-covered --cov-fail-under=72

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # no-undef is the rule that would have caught SB-005 (restartShare ReferenceError).
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      PW_PORT: "5174"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # playwright.config.js starts its own Vite dev server; the specs mock /api.
      - run: npx playwright test
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

  dependency-audit:
    # Reports known-vulnerable dependencies without blocking merges.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: pip-audit (backend)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - name: npm audit (frontend, high and above)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
