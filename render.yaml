# SkillBridge deployment: Vercel frontend + Render FastAPI backend + managed PostgreSQL.
# Syncing this Blueprint creates a billable Render Postgres instance (lowest paid tier).
services:
  - type: web
    name: skillbridge
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    startCommand: sh start.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skillbridge-db
          property: connectionString
      - key: DB_PATH
        value: /data/skillbridge.db
      - key: RETEST_COOLDOWN_HOURS
        value: "336"
      - key: MAX_ATTEMPTS_90D
        value: "3"
      - key: SEED_DEMO
        value: "true"
      - key: CORS_ORIGINS
        value: https://skillbridge-seven-peach.vercel.app,https://skillbridge.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-haiku-5-5

databases:
  - name: skillbridge-db
    databaseName: skillbridge
    user: skillbridge
    plan: 0.1c-256mb
    region: oregon
