# SkillBridge deployment: Vercel frontend + Render FastAPI backend + managed PostgreSQL.
#
# docker-compose.yml provides a local PostgreSQL container only through the
# optional "localdb" profile for development. Render uses its own managed
# PostgreSQL service below; DATABASE_URL is injected into the backend.
services:
  - type: web
    name: skillbridge
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    startCommand: sh start.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skillbridge-db
          property: connectionString
      - key: RETEST_COOLDOWN_HOURS
        value: "336"
      - key: MAX_ATTEMPTS_90D
        value: "3"
      # Never seed demo accounts into the public production database.
      - key: SEED_DEMO
        value: "false"
      - key: SEED_GRAPHRAG_QUESTIONS
        value: "false"
      - key: CORS_ORIGINS
        value: https://skillbridge-seven-peach.vercel.app,https://skillbridge.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-haiku-5-5
      - key: MEILISEARCH_URL
        sync: false
      - key: MEILISEARCH_API_KEY
        sync: false
      - key: MEILISEARCH_QUESTION_INDEX
        value: skillbridge_questions
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: SPACY_MODEL
        value: en_core_web_sm

# Render-managed PostgreSQL replaces the optional local "db" container from
# docker-compose.yml. The backend connects using the internal connection string.
databases:
  - name: skillbridge-db
    databaseName: skillbridge
    user: skillbridge
    plan: 0.1c-256mb
    region: oregon
