# SkillBridge Global R0 prototype.  Run:  docker compose up --build   ->  http://localhost:8080
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_PATH: /data/skillbridge.db
    volumes:
      - sb_data:/data
    restart: unless-stopped
    expose:
      - "8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
volumes:
  sb_data:
