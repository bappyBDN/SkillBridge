# TalentForge uses an external Neon PostgreSQL database (DATABASE_URL from .env).
# A local Postgres container is kept as an optional fallback behind the "localdb"
# profile: `docker compose --profile localdb up`. To use it, point DATABASE_URL in
# .env at postgresql://skillbridge:skillbridge_dev_password@db:5432/skillbridge.
services:
  db:
    image: postgres:16-alpine
    profiles: ["localdb"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillbridge}
      POSTGRES_USER: ${POSTGRES_USER:-skillbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillbridge_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillbridge} -d ${POSTGRES_DB:-skillbridge}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_PATH: /data/skillbridge.db
      # 'database' keeps CVs/photos in the app DB; 'local' writes to the volume.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-database}
      STORAGE_LOCAL_DIR: /data/cv_files
      # nginx (frontend service) is the only ingress and overwrites X-Forwarded-For.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      SEED_QUESTION_BANK_ON_BOOT: ${SEED_QUESTION_BANK_ON_BOOT:-true}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    volumes:
      - sb_data:/data
    restart: unless-stopped
    expose: ["8000"]
    # Liveness (no DB call). /api/ready additionally checks the database.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    # start.sh (the image CMD) seeds the GraphRAG question bank idempotently,
    # then launches uvicorn on :8000.
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  postgres_data:
  sb_data:
