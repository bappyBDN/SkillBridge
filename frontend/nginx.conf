# Self-hosted frontend (docker-compose). Included inside nginx's http {} block
# via /etc/nginx/conf.d/default.conf, so `map` is allowed here.
#
# Security headers are set ONCE at server level. nginx drops every inherited
# add_header as soon as a location declares its own, so locations below must
# not use add_header; per-path caching is driven by the $sb_cache_control map.
# Keep the CSP in sync with frontend/vercel.json (see docs/OPERATIONS.md).

map $uri $sb_cache_control {
  ~^/api/                 "";   # leave API caching to the backend
  ~^/mcp                  "";
  ~^/assets/              "public, max-age=31536000, immutable";  # Vite content-hashed files
  ~^/(mediapipe|face-api)/ "public, max-age=86400";              # stable model/WASM paths, not hashed
  default                 "no-cache";                            # index.html and SPA routes
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 3m;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json
             application/xml application/wasm image/svg+xml font/ttf font/otf;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' https://storage.googleapis.com https://cdn.jsdelivr.net; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  # Ignored by browsers over plain HTTP; takes effect once TLS is terminated in front.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=()" always;
  # Empty value (API/MCP) => header not emitted.
  add_header Cache-Control $sb_cache_control;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    # Overwrite (not append) so a client-supplied X-Forwarded-For is discarded;
    # the backend trusts exactly one proxy hop (TRUSTED_PROXY_HOPS=1).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 240s;
  }
  # MCP Streamable HTTP transport (read-only). SSE needs buffering off.
  location /mcp {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 240s;
  }
  # The standalone agent console fallback uses an inline <script>, so it gets
  # its own, otherwise identical, policy. Declaring add_header here drops the
  # server-level set, so the other security headers are repeated.
  location = /agent-console.html {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache";
  }
  # Hashed bundles: a missing file is a 404, never the SPA shell.
  location /assets/ {
    try_files $uri =404;
  }
  location / {
    try_files $uri /index.html;
  }
}
